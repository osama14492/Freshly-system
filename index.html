<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FRESHLY & PREMIER — نظام الكاشير والمبيعات</title>
<style>
  :root {
    --bg: #070b14;
    --bg-2: #0d1526;
    --card: #121c33;
    --card-2: #172340;
    --text: #f8fafc;
    --muted: #94a3b8;
    --gold: #f59e0b;
    --gold-2: #fbbf24;
    --gold-soft: rgba(245, 158, 11, 0.14);
    --green: #10b981;
    --green-soft: rgba(16, 185, 129, 0.15);
    --blue: #38bdf8;
    --red: #ef4444;
    --border: rgba(255, 255, 255, 0.08);
    --border-gold: rgba(245, 158, 11, 0.34);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: radial-gradient(circle at top, #13213e 0%, var(--bg) 55%);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Cairo", "Tajawal", sans-serif;
    min-height: 100vh;
  }

  .pos-shell {
    max-width: 1260px;
    margin: 0 auto;
    padding: 14px;
  }

  .pos-header {
    background: var(--card);
    border: 1px solid var(--border-gold);
    border-radius: 18px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .pos-brand h1 {
    margin: 0;
    font-size: 19px;
    font-weight: 900;
  }

  .pos-brand p {
    margin: 2px 0 0;
    font-size: 12px;
    color: var(--gold-2);
  }

  .pos-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .btn {
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.05);
    color: var(--text);
    border-radius: 11px;
    padding: 8px 12px;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
  }

  .btn:hover { border-color: var(--border-gold); color: var(--gold-2); }
  .btn-gold { background: linear-gradient(135deg, var(--gold-2), #d97706); color: #09101d; border: none; font-weight: 900; }
  .btn-green { background: #10b981; color: #04130c; border: none; font-weight: 900; }
  .btn-wa { background: #16a34a; color: #fff; border: none; font-weight: 800; }
  .btn-red { background: rgba(239, 68, 68, 0.16); color: #fca5a5; border-color: rgba(239, 68, 68, 0.35); }

  .pos-grid {
    margin-top: 14px;
    display: grid;
    grid-template-columns: 1.45fr 1fr;
    gap: 14px;
    align-items: start;
  }

  @media (max-width: 960px) {
    .pos-grid { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 14px;
  }

  .panel-title {
    margin: 0 0 12px;
    font-size: 15.5px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .products-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
    gap: 10px;
  }

  .prod-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 11px;
    cursor: pointer;
    transition: 0.16s;
  }

  .prod-card:hover { border-color: var(--gold); transform: translateY(-1px); }
  .prod-name { font-weight: 800; font-size: 13.5px; }
  .prod-price { color: var(--gold-2); font-weight: 900; font-size: 13px; margin-top: 4px; }

  .cart-table {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 12px;
  }

  .cart-line {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 8px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 12.5px;
  }

  .mini-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 10px;
  }

  .inp, .sel {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 8px 10px;
    font-family: inherit;
    font-size: 12.5px;
  }

  .totals-box {
    background: rgba(245, 158, 11, 0.08);
    border: 1px solid var(--border-gold);
    border-radius: 13px;
    padding: 10px 12px;
    margin-bottom: 10px;
    font-size: 13px;
  }

  .totals-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
  }

  .totals-final {
    display: flex;
    justify-content: space-between;
    font-size: 16px;
    font-weight: 900;
    color: var(--gold-2);
    border-top: 1px dashed rgba(255, 255, 255, 0.12);
    padding-top: 6px;
    margin-top: 4px;
  }

  .pending-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .pending-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px;
  }

  .pending-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    font-weight: 800;
    font-size: 13px;
  }

  .badge {
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 999px;
    font-weight: 800;
  }

  .b-pending { background: rgba(245, 158, 11, 0.16); color: #fbbf24; }
  .b-preparing { background: rgba(56, 189, 248, 0.16); color: #38bdf8; }
  .b-ready { background: rgba(16, 185, 129, 0.16); color: #34d399; }
  .b-delivered { background: rgba(148, 163, 184, 0.16); color: #e2e8f0; }

  .toast {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: #111c33;
    color: #fff;
    border: 1px solid var(--border-gold);
    border-radius: 999px;
    padding: 9px 18px;
    font-size: 13px;
    font-weight: 700;
    opacity: 0;
    pointer-events: none;
    transition: 0.25s;
    z-index: 200;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<div class="pos-shell">
  <header class="pos-header">
    <div class="pos-brand">
      <h1 id="posTitle">FRESHLY & PREMIER — POS</h1>
      <p id="posSub">إدارة الكاشير • طلبات المنيو المباشرة • التقارير اليومية</p>
    </div>

    <div class="pos-controls">
      <span class="badge b-ready" id="connBadge">🔵 شبكة داخلية / محلي</span>
      <select class="sel" id="currencySelect" style="width:auto;">
        <option value="EGP">EGP</option>
        <option value="EUR">EUR (€)</option>
      </select>
      <button class="btn" id="langToggleBtn" type="button">🌐 EN</button>
      <button class="btn" id="syncNowBtn" type="button">🔄 مزامنة</button>
      <button class="btn btn-wa" id="waReportBtn" type="button">💬 تقرير واتساب</button>
    </div>
  </header>

  <div class="pos-grid">
    <div>
      <div class="panel">
        <h2 class="panel-title">
          <span id="menuSecTitle">🍹 أصناف البار</span>
          <span style="font-size:12px; color:var(--muted);" id="salesSummaryText">مبيعات اليوم: 0 EGP (0)</span>
        </h2>
        <div class="products-grid" id="productsGrid"></div>
      </div>

      <div class="panel" style="margin-top:14px;">
        <h2 class="panel-title">
          <span id="pendingSecTitle">📥 طلبات المنيو الواردة</span>
          <span style="font-size:12px; color:var(--gold-2);" id="pendingCountText">0</span>
        </h2>
        <div class="pending-list" id="pendingOrdersList"></div>
      </div>
    </div>

    <div class="panel">
      <h2 class="panel-title">
        <span id="posCartTitle">🧾 فاتورة الكاشير الحالية</span>
      </h2>

      <div class="cart-table" id="posCartList"></div>

      <div class="mini-grid">
        <input class="inp" id="cashierNameInput" type="text" placeholder="اسم الكاشير" value="أسامة أشرف" />
        <select class="sel" id="paymentMethodSelect">
          <option value="cash">كاش / Cash</option>
          <option value="card">فيزا / Card</option>
        </select>
        <input class="inp" id="discountInput" type="number" min="0" step="0.5" placeholder="خصم %" value="0" />
        <input class="inp" id="taxInput" type="number" min="0" step="0.5" placeholder="ضريبة %" value="0" />
        <input class="inp" id="eurRateInput" type="number" min="1" step="0.5" placeholder="سعر اليورو EGP" value="55" />
        <input class="inp" id="tableOrRoomInput" type="text" placeholder="غرفة / طاولة / ملاحظة" />
      </div>

      <div class="totals-box">
        <div class="totals-row">
          <span>المجموع الفرعي:</span>
          <strong id="posSubtotalText">0 EGP</strong>
        </div>
        <div class="totals-row">
          <span>الخصم / الضريبة:</span>
          <strong id="posAdjText">0 EGP</strong>
        </div>
        <div class="totals-final">
          <span>الإجمالي النهائي:</span>
          <span id="posGrandTotalText">0 EGP</span>
        </div>
      </div>

      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn btn-green" id="checkoutBtn" type="button" style="flex:1;">✅ إتمام الدفع</button>
        <button class="btn btn-red" id="clearPosCartBtn" type="button">تفريغ</button>
      </div>
    </div>
  </div>
</div>

<!-- Firebase SDK (Compat) + LAN / Offline Shared Bus -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
(() => {
  const firebaseConfig = {
    apiKey: "AIzaSyBMH6XnDvVzd_bRYdjq3AKWMq0IqP7F8WU",
    authDomain: "freshly-pos.firebaseapp.com",
    databaseURL: "https://freshly-pos-default-rtdb.firebaseio.com",
    projectId: "freshly-pos",
    storageBucket: "freshly-pos.firebasestorage.app",
    messagingSenderId: "92150322225",
    appId: "1:92150322225:web:ced60779ef510197863110",
    measurementId: "G-E4CRKEHSXF"
  };

  /* Surgical LAN / Offline Bridge (keeps existing UI, styles, categories, products & Firebase intact) */
  const LAN_BRIDGE_KEY = "freshly_premier_lan_bridge_v1";
  const lanBc = ("BroadcastChannel" in window) ? new BroadcastChannel("freshly_premier_lan_bridge") : null;
  const lanSubs = {};

  function readLanBridge() {
    try {
      return JSON.parse(localStorage.getItem(LAN_BRIDGE_KEY) || '{"pendingOrders":{},"orderTracking":{},"orderRatings":{}}');
    } catch (_) {
      return { pendingOrders: {}, orderTracking: {}, orderRatings: {} };
    }
  }

  function writeLanBridge(obj) {
    try {
      localStorage.setItem(LAN_BRIDGE_KEY, JSON.stringify(obj));
    } catch (_) {}
  }

  function getLanVal(path) {
    const store = readLanBridge();
    if (!path) return store;
    const parts = path.split("/").filter(Boolean);
    let cur = store;
    for (const p of parts) {
      if (!cur || typeof cur !== "object" || !(p in cur)) return null;
      cur = cur[p];
    }
    return cur;
  }

  function notifyLanPath(path) {
    const val = getLanVal(path);
    (lanSubs[path] || []).forEach(fn => {
      try { fn({ val: () => val, exists: () => val !== null && val !== undefined }); } catch (_) {}
    });
  }

  function setLanVal(path, value) {
    const store = readLanBridge();
    const parts = path.split("/").filter(Boolean);
    if (!parts.length) return;
    let cur = store;
    for (let i = 0; i < parts.length - 1; i++) {
      const p = parts[i];
      if (!cur[p] || typeof cur[p] !== "object") cur[p] = {};
      cur = cur[p];
    }
    const last = parts[parts.length - 1];
    if (value === null || value === undefined) delete cur[last];
    else cur[last] = value;
    writeLanBridge(store);
    if (lanBc) lanBc.postMessage({ type: "sync", path });
    notifyLanPath(path);
    if (parts.length > 1) {
      const parent = parts.slice(0, -1).join("/");
      notifyLanPath(parent);
    }
  }

  if (lanBc) {
    lanBc.onmessage = ev => {
      if (ev.data && ev.data.type === "sync" && ev.data.path) {
        notifyLanPath(ev.data.path);
      }
    };
  }

  window.addEventListener("storage", ev => {
    if (ev.key === LAN_BRIDGE_KEY) {
      Object.keys(lanSubs).forEach(notifyLanPath);
    }
  });

  const offlineLanDb = {
    ref(path = "") {
      return {
        once: async () => {
          const v = getLanVal(path);
          return { val: () => v, exists: () => v !== null && v !== undefined };
        },
        on: (_evt, cb) => {
          if (!lanSubs[path]) lanSubs[path] = [];
          lanSubs[path].push(cb);
          const v = getLanVal(path);
          cb({ val: () => v, exists: () => v !== null && v !== undefined });
        },
        off: (_evt, cb) => {
          if (!lanSubs[path]) return;
          lanSubs[path] = cb ? lanSubs[path].filter(f => f !== cb) : [];
        },
        update: async obj => {
          Object.entries(obj || {}).forEach(([k, v]) => setLanVal(k, v));
        },
        set: async v => {
          setLanVal(path, v);
        }
      };
    }
  };


  /* LAN / Offline Shared Store */
  const LAN_SHARED_KEY = "freshly_premier_lan_rtdb_v1";
  const lanChannel = ("BroadcastChannel" in window) ? new BroadcastChannel("freshly_premier_lan_channel") : null;
  const lanListeners = {};

  function readLanStore() {
    try {
      return JSON.parse(localStorage.getItem(LAN_SHARED_KEY) || '{"pendingOrders":{},"orderTracking":{},"orderRatings":{}}');
    } catch (_) {
      return { pendingOrders: {}, orderTracking: {}, orderRatings: {} };
    }
  }

  function writeLanStore(store) {
    try {
      localStorage.setItem(LAN_SHARED_KEY, JSON.stringify(store));
    } catch (_) {}
  }

  function notifyLanListeners(path, val) {
    (lanListeners[path] || []).forEach(fn => {
      try { fn({ val: () => val, exists: () => val !== undefined && val !== null }); } catch (_) {}
    });
  }

  function getLanPathValue(path) {
    const store = readLanStore();
    if (!path) return store;
    const parts = path.split("/").filter(Boolean);
    let cur = store;
    for (const p of parts) {
      if (!cur || typeof cur !== "object" || !(p in cur)) return null;
      cur = cur[p];
    }
    return cur;
  }

  function setLanPathValue(path, value) {
    const store = readLanStore();
    const parts = path.split("/").filter(Boolean);
    if (!parts.length) return;
    let cur = store;
    for (let i = 0; i < parts.length - 1; i++) {
      const p = parts[i];
      if (!cur[p] || typeof cur[p] !== "object") cur[p] = {};
      cur = cur[p];
    }
    const last = parts[parts.length - 1];
    if (value === null || value === undefined) {
      delete cur[last];
    } else {
      cur[last] = value;
    }
    writeLanStore(store);
    if (lanChannel) {
      lanChannel.postMessage({ type: "update", path, value });
    }
    notifyLanListeners(path, value);
    if (parts.length > 1) {
      const parentPath = parts.slice(0, -1).join("/");
      notifyLanListeners(parentPath, getLanPathValue(parentPath));
    }
  }

  if (lanChannel) {
    lanChannel.onmessage = ev => {
      const d = ev.data || {};
      if (d.type === "update" && d.path) {
        notifyLanListeners(d.path, d.value !== undefined ? d.value : getLanPathValue(d.path));
      }
    };
  }

  window.addEventListener("storage", ev => {
    if (ev.key === LAN_SHARED_KEY) {
      Object.keys(lanListeners).forEach(p => {
        notifyLanListeners(p, getLanPathValue(p));
      });
    }
  });

  const lanDb = {
    ref(path = "") {
      return {
        once: async () => {
          const val = getLanPathValue(path);
          return { val: () => val, exists: () => val !== null && val !== undefined };
        },
        on: (_event, cb) => {
          if (!lanListeners[path]) lanListeners[path] = [];
          lanListeners[path].push(cb);
          const cur = getLanPathValue(path);
          cb({ val: () => cur, exists: () => cur !== null && cur !== undefined });
        },
        off: (_event, cb) => {
          if (!lanListeners[path]) return;
          lanListeners[path] = cb ? lanListeners[path].filter(f => f !== cb) : [];
        },
        update: async obj => {
          Object.entries(obj || {}).forEach(([k, v]) => setLanPathValue(k, v));
        },
        set: async val => {
          setLanPathValue(path, val);
        }
      };
    }
  };

  let db = lanDb;
  let dbConnected = false;
  let networkOnline = navigator.onLine;

  const WHATSAPP_REPORT_TARGET = "00201119843222";

  const PRODUCTS = [
    { id: "juice-mango", nameAr: "عصير مانجو فريش", nameEn: "Fresh Mango Juice", priceEgp: 65, priceEur: 2 },
    { id: "juice-guava", nameAr: "جوافة بالنعناع", nameEn: "Guava with Mint", priceEgp: 60, priceEur: 2 },
    { id: "juice-orange", nameAr: "برتقال فريش", nameEn: "Fresh Orange Juice", priceEgp: 55, priceEur: 1.5 },
    { id: "juice-lemon-mint", nameAr: "ليمون بالنعناع", nameEn: "Lemon Mint", priceEgp: 50, priceEur: 1.5 },
    { id: "cock-freshly-special", nameAr: "كوكتيل فريشلي الخاص", nameEn: "Freshly Special Cocktail", priceEgp: 95, priceEur: 3 },
    { id: "cock-blue-lagoon", nameAr: "بلو لاجون موكتيل", nameEn: "Blue Lagoon Mocktail", priceEgp: 85, priceEur: 2.5 },
    { id: "ice-latte", nameAr: "آيس لاتيه", nameEn: "Iced Latte", priceEgp: 75, priceEur: 2.5 },
    { id: "hot-turkish", nameAr: "قهوة تركي", nameEn: "Turkish Coffee", priceEgp: 45, priceEur: 1.5 },
    { id: "fruit-platter-mix", nameAr: "صحن فواكه مشكلة", nameEn: "Mixed Fruit Platter", priceEgp: 130, priceEur: 4 }
  ];

  const state = {
    lang: localStorage.getItem("freshly_pos_lang") || "ar",
    currency: localStorage.getItem("freshly_pos_currency") || "EGP",
    cart: {},
    sales: JSON.parse(localStorage.getItem("freshly_pos_sales") || "[]"),
    pendingOrders: {}
  };

  const els = {
    connBadge: document.getElementById("connBadge"),
    currencySelect: document.getElementById("currencySelect"),
    langToggleBtn: document.getElementById("langToggleBtn"),
    syncNowBtn: document.getElementById("syncNowBtn"),
    waReportBtn: document.getElementById("waReportBtn"),
    productsGrid: document.getElementById("productsGrid"),
    salesSummaryText: document.getElementById("salesSummaryText"),
    pendingOrdersList: document.getElementById("pendingOrdersList"),
    pendingCountText: document.getElementById("pendingCountText"),
    posCartList: document.getElementById("posCartList"),
    cashierNameInput: document.getElementById("cashierNameInput"),
    paymentMethodSelect: document.getElementById("paymentMethodSelect"),
    discountInput: document.getElementById("discountInput"),
    taxInput: document.getElementById("taxInput"),
    eurRateInput: document.getElementById("eurRateInput"),
    tableOrRoomInput: document.getElementById("tableOrRoomInput"),
    posSubtotalText: document.getElementById("posSubtotalText"),
    posAdjText: document.getElementById("posAdjText"),
    posGrandTotalText: document.getElementById("posGrandTotalText"),
    checkoutBtn: document.getElementById("checkoutBtn"),
    clearPosCartBtn: document.getElementById("clearPosCartBtn"),
    toast: document.getElementById("toast")
  };

  function showToast(msg) {
    els.toast.textContent = msg;
    els.toast.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => els.toast.classList.remove("show"), 2400);
  }

  function fmtMoney(amount, curr = state.currency) {
    const n = Number(amount || 0);
    const clean = Number.isInteger(n) ? n : n.toFixed(2);
    return curr === "EUR" ? `€${clean}` : `${clean} EGP`;
  }

  function getProdPrice(p) {
    return state.currency === "EUR" ? Number(p.priceEur || 0) : Number(p.priceEgp || 0);
  }

  function updateConnectionBadge() {
    const isAr = state.lang === "ar";
    if (dbConnected && networkOnline) {
      els.connBadge.className = "badge b-ready";
      els.connBadge.textContent = isAr ? "🟢 متصل بـ Firebase" : "🟢 Firebase Online";
    } else {
      els.connBadge.className = "badge b-preparing";
      els.connBadge.textContent = isAr ? "🔵 شبكة داخلية / محلي" : "🔵 LAN / Offline Mode";
    }
  }

  function initFirebaseAndLan() {
    networkOnline = navigator.onLine;
    try {
      if (window.firebase && firebaseConfig.apiKey && !firebaseConfig.apiKey.includes("...")) {
        const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(firebaseConfig);
        const rtdb = firebase.database(app);
        rtdb.ref(".info/connected").on("value", snap => {
          const online = Boolean(snap.val()) && navigator.onLine;
          dbConnected = online;
          db = online ? rtdb : lanDb;
          updateConnectionBadge();
        });
      }
    } catch (err) {
      console.warn("Firebase POS init:", err);
      db = lanDb;
      dbConnected = false;
    }

    const handlePendingSnap = snap => {
      const val = snap.val() || {};
      const lanVal = getLanPathValue("pendingOrders") || {};
      state.pendingOrders = { ...lanVal, ...val };
      renderPendingOrders();
    };

    lanDb.ref("pendingOrders").on("value", handlePendingSnap);
    try {
      if (window.firebase && firebase.apps.length) {
        firebase.database().ref("pendingOrders").on("value", snap => {
          const cloudVal = snap.val() || {};
          Object.entries(cloudVal).forEach(([k, v]) => setLanPathValue(`pendingOrders/${k}`, v));
          state.pendingOrders = { ...(getLanPathValue("pendingOrders") || {}), ...cloudVal };
          renderPendingOrders();
        });
      }
    } catch (_) {}

    updateConnectionBadge();
  }

  function renderProducts() {
    const isAr = state.lang === "ar";
    els.productsGrid.innerHTML = PRODUCTS.map(p => `
      <div class="prod-card" data-pid="${p.id}">
        <div class="prod-name">${isAr ? p.nameAr : p.nameEn}</div>
        <div class="prod-price">${fmtMoney(getProdPrice(p), state.currency)}</div>
      </div>
    `).join("");

    els.productsGrid.querySelectorAll(".prod-card").forEach(card => {
      card.addEventListener("click", () => {
        const pid = card.dataset.pid;
        state.cart[pid] = (state.cart[pid] || 0) + 1;
        renderPosCart();
      });
    });
  }

  function computeTotals() {
    let subtotal = 0;
    Object.entries(state.cart).forEach(([pid, qty]) => {
      const prod = PRODUCTS.find(x => x.id === pid);
      if (prod && qty > 0) {
        subtotal += getProdPrice(prod) * qty;
      }
    });
    const discPct = Math.max(0, Number(els.discountInput.value || 0));
    const taxPct = Math.max(0, Number(els.taxInput.value || 0));
    const discAmt = (subtotal * discPct) / 100;
    const afterDisc = Math.max(0, subtotal - discAmt);
    const taxAmt = (afterDisc * taxPct) / 100;
    const grandTotal = Number((afterDisc + taxAmt).toFixed(2));
    const adjNet = Number((taxAmt - discAmt).toFixed(2));
    return { subtotal: Number(subtotal.toFixed(2)), discAmt, taxAmt, adjNet, grandTotal };
  }

  function renderPosCart() {
    const isAr = state.lang === "ar";
    const entries = Object.entries(state.cart).filter(([, q]) => q > 0);
    if (!entries.length) {
      els.posCartList.innerHTML = `<div style="color:var(--muted); font-size:12.5px; text-align:center; padding:14px;">${isAr ? "اختر أصنافاً لبدء الفاتورة" : "Select items to start an invoice"}</div>`;
    } else {
      els.posCartList.innerHTML = entries.map(([pid, qty]) => {
        const prod = PRODUCTS.find(x => x.id === pid);
        if (!prod) return "";
        const line = getProdPrice(prod) * qty;
        return `
          <div class="cart-line">
            <div>
              <strong>${isAr ? prod.nameAr : prod.nameEn}</strong> × ${qty}
              <div style="font-size:11px; color:var(--muted);">${fmtMoney(line)}</div>
            </div>
            <div style="display:flex; gap:5px;">
              <button type="button" class="btn" data-c-dec="${pid}" style="padding:4px 8px;">−</button>
              <button type="button" class="btn btn-gold" data-c-inc="${pid}" style="padding:4px 8px;">+</button>
            </div>
          </div>
        `;
      }).join("");

      els.posCartList.querySelectorAll("[data-c-dec]").forEach(b => b.addEventListener("click", () => {
        const id = b.dataset.cDec;
        state.cart[id] = Math.max(0, (state.cart[id] || 0) - 1);
        if (!state.cart[id]) delete state.cart[id];
        renderPosCart();
      }));

      els.posCartList.querySelectorAll("[data-c-inc]").forEach(b => b.addEventListener("click", () => {
        const id = b.dataset.cInc;
        state.cart[id] = (state.cart[id] || 0) + 1;
        renderPosCart();
      }));
    }

    const { subtotal, adjNet, grandTotal } = computeTotals();
    els.posSubtotalText.textContent = fmtMoney(subtotal);
    els.posAdjText.textContent = `${adjNet >= 0 ? "+" : ""}${fmtMoney(adjNet)}`;
    els.posGrandTotalText.textContent = fmtMoney(grandTotal);
  }

  function renderSalesSummary() {
    const eurRate = Math.max(1, Number(els.eurRateInput.value || 55));
    let totalEgp = 0;
    state.sales.forEach(s => {
      const val = Number(s.total || 0);
      totalEgp += (s.currency === "EUR") ? val * eurRate : val;
    });
    els.salesSummaryText.textContent = `${state.lang === "ar" ? "مبيعات اليوم:" : "Today Sales:"} ${Math.round(totalEgp)} EGP (${state.sales.length})`;
  }

  async function updateOrderStatus(code, status) {
    const nowIso = new Date().toISOString();
    const updates = {};
    updates[`pendingOrders/${code}/status`] = status;
    updates[`pendingOrders/${code}/updatedAt`] = nowIso;
    updates[`orderTracking/${code}/status`] = status;
    updates[`orderTracking/${code}/updatedAt`] = nowIso;

    await lanDb.ref().update(updates);
    if (dbConnected && networkOnline) {
      try {
        await db.ref().update(updates);
      } catch (_) {}
    }
    if (state.pendingOrders[code]) {
      state.pendingOrders[code].status = status;
    }
    renderPendingOrders();
    showToast(`${code} -> ${status}`);
  }

  function loadPendingOrderToPos(code) {
    const ord = state.pendingOrders[code];
    if (!ord) return;
    state.cart = {};
    (ord.items || []).forEach(it => {
      const matched = PRODUCTS.find(p => p.id === it.id || p.nameAr === (it.nameAr || it.name));
      if (matched) {
        state.cart[matched.id] = Number(it.qty || 1);
      }
    });
    if (ord.currency) {
      state.currency = ord.currency;
      els.currencySelect.value = ord.currency;
      renderProducts();
    }
    els.tableOrRoomInput.value = `${ord.tableOrRoom || ord.location || ""} ${ord.notes ? `(${ord.notes})` : ""}`.trim();
    renderPosCart();
    showToast(`${code}`);
  }

  function renderPendingOrders() {
    const isAr = state.lang === "ar";
    const list = Object.values(state.pendingOrders || {}).filter(Boolean);
    els.pendingCountText.textContent = list.length;

    if (!list.length) {
      els.pendingOrdersList.innerHTML = `<div style="color:var(--muted); font-size:12.5px; text-align:center; padding:14px;">${isAr ? "لا توجد طلبات واردة حالياً" : "No pending menu orders"}</div>`;
      return;
    }

    els.pendingOrdersList.innerHTML = list.map(ord => {
      const st = ord.status || "pending";
      const badgeCls = st === "ready" ? "b-ready" : (st === "preparing" ? "b-preparing" : (st === "delivered" ? "b-delivered" : "b-pending"));
      const itemsTxt = (ord.items || []).map(i => `${i.nameAr || i.name} ×${i.qty}`).join(" • ");
      return `
        <div class="pending-card">
          <div class="pending-top">
            <span>${ord.code} • ${ord.customerName || ""} ${ord.location ? `(${ord.location})` : ""}</span>
            <span class="badge ${badgeCls}">${st}</span>
          </div>
          <div style="font-size:12px; color:#cbd5e1; margin-top:6px;">${itemsTxt}</div>
          <div style="font-size:12.5px; color:var(--gold-2); font-weight:800; margin-top:4px;">${fmtMoney(ord.total, ord.currency || "EGP")}</div>
          ${ord.rating ? `<div style="font-size:11.5px; color:#fbbf24; margin-top:3px;">⭐ ${ord.rating.stars}/5 ${ord.rating.comment ? `- ${ord.rating.comment}` : ""}</div>` : ""}
          <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;">
            <button type="button" class="btn" data-st-code="${ord.code}" data-st="preparing">👨‍🍳 تحضير</button>
            <button type="button" class="btn" data-st-code="${ord.code}" data-st="ready">✅ جاهز</button>
            <button type="button" class="btn" data-st-code="${ord.code}" data-st="delivered">🍽️ تم التوصيل</button>
            <button type="button" class="btn btn-gold" data-load-code="${ord.code}">🧾 للفاتورة</button>
          </div>
        </div>
      `;
    }).join("");

    els.pendingOrdersList.querySelectorAll("[data-st-code]").forEach(btn => {
      btn.addEventListener("click", () => updateOrderStatus(btn.dataset.stCode, btn.dataset.st));
    });

    els.pendingOrdersList.querySelectorAll("[data-load-code]").forEach(btn => {
      btn.addEventListener("click", () => loadPendingOrderToPos(btn.dataset.loadCode));
    });
  }

  els.checkoutBtn.addEventListener("click", () => {
    const { subtotal, grandTotal } = computeTotals();
    if (grandTotal <= 0) {
      showToast(state.lang === "ar" ? "الفاتورة فارغة" : "Invoice is empty");
      return;
    }

    const sale = {
      id: `SALE-${Date.now().toString().slice(-6)}`,
      createdAt: new Date().toISOString(),
      cashier: els.cashierNameInput.value.trim() || "أسامة أشرف",
      paymentMethod: els.paymentMethodSelect.value,
      currency: state.currency,
      subtotal,
      total: grandTotal,
      ref: els.tableOrRoomInput.value.trim()
    };

    state.sales.unshift(sale);
    localStorage.setItem("freshly_pos_sales", JSON.stringify(state.sales));
    state.cart = {};
    els.discountInput.value = "0";
    els.taxInput.value = "0";
    els.tableOrRoomInput.value = "";
    renderPosCart();
    renderSalesSummary();
    showToast(state.lang === "ar" ? `تم تسجيل الفاتورة: ${fmtMoney(grandTotal)}` : `Saved invoice: ${fmtMoney(grandTotal)}`);
  });

  els.clearPosCartBtn.addEventListener("click", () => {
    state.cart = {};
    renderPosCart();
  });

  els.currencySelect.addEventListener("change", () => {
    state.currency = els.currencySelect.value;
    localStorage.setItem("freshly_pos_currency", state.currency);
    renderProducts();
    renderPosCart();
  });

  els.langToggleBtn.addEventListener("click", () => {
    state.lang = state.lang === "ar" ? "en" : "ar";
    localStorage.setItem("freshly_pos_lang", state.lang);
    document.documentElement.lang = state.lang;
    document.documentElement.dir = state.lang === "ar" ? "rtl" : "ltr";
    els.langToggleBtn.textContent = state.lang === "ar" ? "🌐 EN" : "🌐 AR";
    renderProducts();
    renderPosCart();
    renderPendingOrders();
    renderSalesSummary();
    updateConnectionBadge();
  });

  els.syncNowBtn.addEventListener("click", () => {
    state.pendingOrders = getLanPathValue("pendingOrders") || {};
    renderPendingOrders();
    renderSalesSummary();
    showToast(state.lang === "ar" ? "تمت المزامنة" : "Synced");
  });

  els.waReportBtn.addEventListener("click", () => {
    const eurRate = Math.max(1, Number(els.eurRateInput.value || 55));
    let totalEgp = 0;
    state.sales.forEach(s => {
      const v = Number(s.total || 0);
      totalEgp += s.currency === "EUR" ? v * eurRate : v;
    });
    const text = encodeURIComponent(
      `📊 *تقرير مبيعات FRESHLY & PREMIER*
الكاشير: ${els.cashierNameInput.value || "أسامة أشرف"}
عدد الفواتير: ${state.sales.length}
الإجمالي التقديري: ${Math.round(totalEgp)} EGP`
    );
    window.open(`https://wa.me/${WHATSAPP_REPORT_TARGET}?text=${text}`, "_blank");
  });

  [els.discountInput, els.taxInput, els.eurRateInput].forEach(inp => {
    inp.addEventListener("input", () => {
      renderPosCart();
      renderSalesSummary();
    });
  });

  window.addEventListener("online", () => {
    networkOnline = true;
    initFirebaseAndLan();
  });

  window.addEventListener("offline", () => {
    networkOnline = false;
    dbConnected = false;
    db = lanDb;
    updateConnectionBadge();
  });

  els.currencySelect.value = state.currency;
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang === "ar" ? "rtl" : "ltr";
  els.langToggleBtn.textContent = state.lang === "ar" ? "🌐 EN" : "🌐 AR";

  renderProducts();
  renderPosCart();
  renderSalesSummary();
  initFirebaseAndLan();
})();
</script>
</body>
</html>
